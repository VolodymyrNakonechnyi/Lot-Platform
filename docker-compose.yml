services:
  postgres:
    image: postgres:17-alpine
    container_name: bullmq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bullmq
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d bullmq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
