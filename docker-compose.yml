services:
  postgres:
    image: postgres:18-alpine
    container_name: bullmq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bullmq
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d bullmq']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: bullmq-mailpit
    restart: unless-stopped
    environment:
      # Catch-all test server: no auth, no TLS, keeps mail in memory only.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      # SMTP, and the web UI at http://localhost:8025
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local image CDN origin. S3 API on :9000, web console on http://localhost:9001.
  # bitnamilegacy packages the same MinIO server: docker.io/minio/* and
  # quay.io/minio/* no longer allow anonymous pulls.
  minio:
    image: bitnamilegacy/minio:latest
    container_name: bullmq-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Created on boot; `download` = anonymous GET, which is what makes it a
      # CDN origin. Uploads still need the access keys.
      MINIO_DEFAULT_BUCKETS: lot-images:download
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
